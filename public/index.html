<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GroveCloud test — grove-tech</title>
<style>
  :root {
    --bg: #f6f7f5; --card: #ffffff; --ink: #1a1f1c; --muted: #61706a;
    --line: #e2e6e1; --accent: #2f7d4f; --accent-soft: #e8f3ec; --bad: #b4453a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12150f; --card: #1b1f19; --ink: #e9ede7; --muted: #99a69e;
      --line: #2c332a; --accent: #6cc48a; --accent-soft: #1f2d24; --bad: #e08074;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px; margin-bottom: 16px;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px;
    border-radius: 999px; background: var(--accent-soft); color: var(--accent);
    font-weight: 600; font-size: 14px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em;
       color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  dl { display: grid; grid-template-columns: minmax(120px, auto) 1fr; gap: 8px 16px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
       font-size: 13px; word-break: break-all; }
  button {
    font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  pre {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; overflow-x: auto; font-size: 12px; margin: 12px 0 0;
  }
  .err { color: var(--bad); }
</style>
</head>
<body>
<div class="wrap">
  <h1>grove-tech · testovacia appka</h1>
  <p class="sub">Overuje, ci GroveCloud hosting spravne postavil, spustil a vystavil aplikaciu.</p>

  <div class="card">
    <span class="pill" id="status"><span class="dot"></span><span id="status-text">Nacitavam…</span></span>
  </div>

  <div class="card">
    <h2>Behove prostredie</h2>
    <dl id="info"><dt>…</dt><dd>nacitavam</dd></dl>
  </div>

  <div class="card">
    <h2>Premenne prostredia (APP_*)</h2>
    <dl id="env"><dt>…</dt><dd>nacitavam</dd></dl>
  </div>

  <div class="card">
    <h2>Test POST /api/echo</h2>
    <button id="echo">Odoslat testovaci JSON</button>
    <pre id="echo-out" hidden></pre>
  </div>
</div>

<script>
  const fill = (el, obj) => {
    el.innerHTML = '';
    const entries = Object.entries(obj);
    if (!entries.length) {
      el.innerHTML = '<dt>—</dt><dd>ziadne nastavene</dd>';
      return;
    }
    for (const [k, v] of entries) {
      const dt = document.createElement('dt');
      dt.textContent = k;
      const dd = document.createElement('dd');
      dd.textContent = typeof v === 'object' ? JSON.stringify(v) : String(v);
      el.append(dt, dd);
    }
  };

  fetch('/api/info')
    .then(r => r.json())
    .then(d => {
      document.getElementById('status-text').textContent = 'Aplikacia bezi · ' + d.message;
      fill(document.getElementById('info'), {
        'Node': d.node, 'Platforma': d.platform, 'Hostname': d.hostname,
        'Port': d.port, 'Protokol': d.proto, 'Klient IP': d.clientIp,
        'Spustena': d.startedAt, 'Uptime (s)': d.uptimeSeconds, 'Cas servera': d.now,
        'Stage': d.stage,
      });
      fill(document.getElementById('env'), d.appEnv);
    })
    .catch(e => {
      const s = document.getElementById('status');
      s.classList.add('err');
      document.getElementById('status-text').textContent = 'Chyba: ' + e.message;
    });

  document.getElementById('echo').addEventListener('click', async () => {
    const out = document.getElementById('echo-out');
    out.hidden = false;
    out.textContent = 'Odosielam…';
    try {
      const r = await fetch('/api/echo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ test: true, odoslane: new Date().toISOString() }),
      });
      out.textContent = JSON.stringify(await r.json(), null, 2);
    } catch (e) {
      out.textContent = 'Chyba: ' + e.message;
    }
  });
</script>
</body>
</html>
